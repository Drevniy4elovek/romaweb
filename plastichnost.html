<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Симуляция: Силовой бросок 2025</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: white; font-family: sans-serif; }
        canvas { display: block; }
        .ui { 
            position: absolute; top: 20px; left: 20px; pointer-events: none; 
            background: rgba(0,0,0,0.9); padding: 15px; border-radius: 8px; border: 1px solid #444;
        }
        b { color: #ffcc00; }
        .charge-hint { color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ui">
        ЛКМ: <b>Огонь</b> | <span class="charge-hint">Зажмите ПКМ или 'G': ЗАРЯД БРОСКА</span><br>
        Чем дольше держать, тем мощнее взрыв и быстрее полет!
    </div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let width, height, timeScale = 1.0;
let bullets = [], particles = [], segments = [], grenades = [];
let isMouseDown = false, isCharging = false, chargeLevel = 0;
let lastShotTime = 0, mousePos = { x: 0, y: 0 };

const WEAPONS = {
    1: { name: "ПИСТОЛЕТ", fireRate: 300, speed: 45, spread: 0.01, damage: 35, color: "#ffcc00" },
    2: { name: "ПУЛЕМЁТ", fireRate: 90, speed: 40, spread: 0.08, damage: 15, color: "#ff6600" },
    3: { name: "МИНИГАН", fireRate: 30, speed: 38, spread: 0.2, damage: 8, color: "#ff3300" }
};
let currentWeapon = WEAPONS[1];

function init() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    bullets = []; particles = []; segments = []; grenades = [];
    timeScale = 1.0;

    createWall(width * 0.4, 15, 80, '#966f47', 'wood', 100);
    createWall(width * 0.6, 10, 70, '#777', 'iron', 300);
    createWall(width * 0.8, 40, 50, '#444', 'concrete', 800);
}

function createWall(x, w, count, color, type, hp) {
    const sH = height / count;
    for(let i = 0; i < count; i++) {
        segments.push({
            x, y: i * sH, w, h: sH + 1,
            hp: hp, maxHp: hp, type, color,
            isFallen: false, vy: 0, vx: 0, angle: 0, va: 0
        });
    }
}

class Grenade {
    constructor(x, y, targetY, power) {
        this.x = x; this.y = y;
        // Сила влияет на горизонтальную скорость (от 15 до 55)
        this.vx = 15 + power * 40; 
        this.vy = (targetY - y) / 15 - (5 + power * 10);
        this.radius = 120 + power * 150; // Радиус растет с силой
        this.power = power;
        this.dead = false;
    }

    update(ts) {
        this.x += this.vx * ts;
        this.y += this.vy * ts;
        this.vy += 0.6 * ts;

        for (let s of segments) {
            if (s.hp > 0 && !s.isFallen && this.x > s.x && this.x < s.x + s.w && this.y > s.y && this.y < s.y + s.h) {
                this.explode(); break;
            }
        }
        if (this.x > width || this.y > height) this.dead = true;
    }

    explode() {
        if(this.dead) return;
        this.dead = true;
        timeScale = 0.04; 

        segments.forEach(s => {
            const dx = (s.x + s.w/2) - this.x;
            const dy = (s.y + s.h/2) - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < this.radius) {
                const force = (1 - dist / this.radius);
                const totalDamage = force * (1000 + this.power * 3000);
                s.hp -= totalDamage;
                
                if (s.hp <= 0 || force > 0.4) {
                    s.hp = 0; s.isFallen = true;
                    const blastScale = 20 + this.power * 30;
                    s.vx = (dx / dist) * blastScale * force;
                    s.vy = (dy / dist) * blastScale * force - 10;
                    s.va = (Math.random() - 0.5) * (0.5 + this.power);
                }
            }
        });

        // Визуальный эффект взрыва
        const pCount = 50 + this.power * 150;
        for(let i=0; i<pCount; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = Math.random() * (20 + this.power * 40);
            const color = i % 2 === 0 ? (this.power > 0.8 ? '#fff' : '#ff4400') : '#444';
            particles.push(new Particle(this.x, this.y, Math.cos(a)*s, Math.sin(a)*s, color, Math.random()* (5 + this.power * 10)));
        }
    }

    draw() {
        ctx.fillStyle = `rgb(${40 + this.power * 100}, ${80 + this.power * 40}, 40)`;
        ctx.beginPath(); ctx.arc(this.x, this.y, 8 + this.power * 4, 0, 7); ctx.fill();
        if (this.power > 0.9) { // Эффект критического заряда
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
        }
    }
}

class Particle {
    constructor(x, y, vx, vy, color, size) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.life = 1.0; this.color = color; this.size = size;
    }
    update(ts) {
        this.x += this.vx * ts; this.y += this.vy * ts;
        this.vy += 0.1 * ts; this.life -= 0.015 * ts;
    }
    draw() {
        ctx.fillStyle = this.color; ctx.globalAlpha = this.life;
        ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1;
    }
}

function update() {
    ctx.clearRect(0, 0, width, height);
    
    if (isMouseDown) {
        const now = Date.now();
        if (now - lastShotTime > currentWeapon.fireRate) {
            lastShotTime = now;
            bullets.push({x: 10, y: mousePos.y, angle: (Math.random()-0.5)*currentWeapon.spread, speed: currentWeapon.speed, active: true});
        }
    }

    if (isCharging && chargeLevel < 1) chargeLevel += 0.015;

    if (timeScale < 1.0) timeScale += 0.015;

    // Стены
    segments.forEach(s => {
        if (s.hp > 0 || s.isFallen) {
            if (s.isFallen) {
                s.vy += 0.4 * timeScale; s.y += s.vy * timeScale;
                s.x += s.vx * timeScale; s.angle += s.va * timeScale;
            }
            ctx.save();
            if (s.isFallen) {
                ctx.translate(s.x + s.w/2, s.y + s.h/2);
                ctx.rotate(s.angle);
                ctx.translate(-(s.x + s.w/2), -(s.y + s.h/2));
            }
            ctx.fillStyle = s.color;
            ctx.globalAlpha = s.isFallen ? 0.4 : 0.3 + (s.hp / s.maxHp * 0.7);
            ctx.fillRect(s.x, s.y, s.w, s.h);
            ctx.restore();
            if (s.y > height + 200) s.hp = -1;
        }
    });

    grenades = grenades.filter(g => !g.dead);
    grenades.forEach(g => { g.update(timeScale); g.draw(); });

    bullets.forEach(b => {
        b.x += Math.cos(b.angle) * b.speed * timeScale;
        b.y += Math.sin(b.angle) * b.speed * timeScale;
        ctx.fillStyle = currentWeapon.color;
        ctx.fillRect(b.x - 5, b.y - 1, 10, 2);
        for (let s of segments) {
            if (s.hp > 0 && !s.isFallen && b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
                s.hp -= currentWeapon.damage;
                if (s.hp <= 0) s.isFallen = true;
                b.active = false; break;
            }
        }
    });
    bullets = bullets.filter(b => b.active);

    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.update(timeScale); p.draw(); });

    // Отрисовка индикатора заряда
    if (isCharging) {
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(mousePos.x - 25, mousePos.y + 20, 50, 6);
        ctx.fillStyle = chargeLevel > 0.9 ? 'white' : `hsl(${chargeLevel*120}, 100%, 50%)`;
        ctx.fillRect(mousePos.x - 25, mousePos.y + 20, 50 * chargeLevel, 6);
    }

    requestAnimationFrame(update);
}

window.onmousedown = (e) => {
    if (e.button === 2) { isCharging = true; chargeLevel = 0; }
    else isMouseDown = true;
};

window.onmouseup = (e) => {
    if (e.button === 2 && isCharging) {
        grenades.push(new Grenade(10, mousePos.y, mousePos.y, chargeLevel));
        isCharging = false;
        chargeLevel = 0;
    }
    isMouseDown = false;
};

window.onkeydown = (e) => {
    if (WEAPONS[e.key]) currentWeapon = WEAPONS[e.key];
    if (e.code === 'KeyG' && !isCharging) { isCharging = true; chargeLevel = 0; }
    if (e.code === 'Space') init();
};

window.onkeyup = (e) => {
    if (e.code === 'KeyG' && isCharging) {
        grenades.push(new Grenade(10, mousePos.y, mousePos.y, chargeLevel));
        isCharging = false;
    }
};

window.onmousemove = (e) => { mousePos.x = e.clientX; mousePos.y = e.clientY; };
window.oncontextmenu = (e) => e.preventDefault();
window.onresize = init;

init(); update();
</script>
</body>
</html>
