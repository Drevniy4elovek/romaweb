<style>
    :root {
        --bg: #0a0a0c;
        --btn-bg: #1e1e24;
        --btn-hover: #2d2d35;
        --accent: #4f46e5;
        --folder-accent: #f59e0b;
        --text: #ffffff;
    }

    body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px 20px;
        margin: 0;
    }

    h1 {
        margin-bottom: 50px;
        font-size: 2.5rem; /* Увеличенный заголовок */
        letter-spacing: -1px;
    }

    .container {
        display: grid;
        /* Увеличили минимальную ширину кнопки до 350px */
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
        gap: 30px; /* Увеличили расстояние между кнопками */
        width: 100%;
        max-width: 1200px;
    }

    /* УВЕЛИЧЕННАЯ КНОПКА */
    .btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: var(--btn-bg);
        color: white;
        text-decoration: none;
        padding: 35px 40px; /* Сильно увеличили внутренние отступы */
        border-radius: 20px; /* Более мягкие углы */
        border: 1px solid #333;
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .btn:hover {
        background-color: var(--btn-hover);
        transform: scale(1.03); /* Кнопка слегка увеличивается при наведении */
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }

    .title {
        font-size: 1.5rem; /* Увеличенный текст названия */
        font-weight: 700;
    }

    .type {
        font-size: 0.9rem; /* Увеличенный текст подписи */
        color: #aaa;
        text-transform: uppercase;
        margin-top: 8px;
        letter-spacing: 1px;
    }

    .icon {
        font-size: 2.5rem; /* Увеличенная иконка */
        background: rgba(255,255,255,0.05);
        padding: 15px;
        border-radius: 15px;
    }

    .folder-btn {
        border-left: 8px solid var(--folder-accent); /* Толстая полоса для папок */
    }

    .file-btn {
        border-left: 8px solid var(--accent); /* Толстая полоса для файлов */
    }

    .label {
        display: flex;
        flex-direction: column;
    }
</style>
