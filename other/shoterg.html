<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Portal 2026: Auto-Generator</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        canvas { width: 800px; height: 400px; background: #000; border: 3px solid #444; image-rendering: pixelated; }
        #ui { position: absolute; color: white; top: 10px; text-align: center; pointer-events: none; text-shadow: 2px 2px 0px #000; }
    </style>
</head>
<body>
    <div id="ui"><b>Уровень сгенерирован случайно</b><br>E - Взять куб | Положи его на кнопку, чтобы открыть выход</div>
    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = 400, H = 200, SIZE = 12; // Размер лабиринта 12x12
    canvas.width = W; canvas.height = H;

    let map = [];
    const player = { x: 0, y: 0, dir: 0, pitch: 0, speed: 0.07, tpCooldown: 0 };
    const cube = { x: 0, y: 0, held: false };
    const button = { x: 0, y: 0, pressed: false };
    const exitPos = { x: 0, y: 0 };
    const portals = { blue: null, orange: null };
    const keys = {};

    // --- ГЕНЕРАЦИЯ УРОВНЯ ---
    function generateLevel() {
        // 1. Заполняем пустотой и границами
        for (let y = 0; y < SIZE; y++) {
            map[y] = [];
            for (let x = 0; x < SIZE; x++) {
                map[y][x] = (x === 0 || x === SIZE - 1 || y === 0 || y === SIZE - 1) ? 1 : 0;
            }
        }
        // 2. Случайные стены (30% заполнения)
        for (let i = 0; i < (SIZE * SIZE) * 0.3; i++) {
            let rx = Math.floor(Math.random() * (SIZE - 2)) + 1;
            let ry = Math.floor(Math.random() * (SIZE - 2)) + 1;
            map[ry][rx] = 1;
        }
        // 3. Функция поиска свободного места
        const getEmpty = () => {
            let rx, ry;
            do {
                rx = Math.floor(Math.random() * (SIZE - 2)) + 1;
                ry = Math.floor(Math.random() * (SIZE - 2)) + 1;
            } while (map[ry][rx] !== 0);
            return { x: rx + 0.5, y: ry + 0.5, tx: rx, ty: ry };
        };
        // 4. Размещаем объекты
        let pPos = getEmpty(); player.x = pPos.x; player.y = pPos.y;
        let cPos = getEmpty(); cube.x = cPos.x; cube.y = cPos.y;
        let bPos = getEmpty(); button.x = bPos.x; button.y = bPos.y;
        let ePos = getEmpty(); exitPos.x = ePos.tx; exitPos.y = ePos.ty;
        map[exitPos.y][exitPos.x] = 2; // Ставим дверь
    }

    generateLevel();

    // --- УПРАВЛЕНИЕ ---
    canvas.onclick = () => canvas.requestPointerLock();
    document.addEventListener('keydown', (e) => { 
        keys[e.code] = true; 
        if(e.code === 'KeyE') {
            if(cube.held) cube.held = false;
            else if(Math.hypot(player.x - cube.x, player.y - cube.y) < 1.2) cube.held = true;
        }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            player.dir += e.movementX * 0.003;
            player.pitch = Math.max(-80, Math.min(80, player.pitch - e.movementY * 0.8));
        }
    });
    canvas.onmousedown = (e) => {
        if(!document.pointerLockElement) return;
        const type = e.button === 0 ? 'blue' : 'orange';
        let d = 0, dx = Math.cos(player.dir), dy = Math.sin(player.dir);
        while (d < 15) {
            d += 0.05;
            let tx = Math.floor(player.x + dx * d), ty = Math.floor(player.y + dy * d);
            if (map[ty] && map[ty][tx] === 1) {
                let xd = Math.abs((player.x+dx*d)-(tx+0.5)), yd = Math.abs((player.y+dy*d)-(ty+0.5));
                let side = xd > yd ? ((player.x+dx*d)<tx+0.5?'W':'E') : ((player.y+dy*d)<ty+0.5?'N':'S');
                portals[type] = { x: player.x+dx*d, y: player.y+dy*d, tx, ty, side, angle: player.dir };
                break;
            }
        }
    };
    document.oncontextmenu = (e) => e.preventDefault();

    // --- ГЛАВНЫЙ ЦИКЛ ---
    function frame() {
        if (document.pointerLockElement) {
            if(cube.held) { cube.x = player.x + Math.cos(player.dir) * 0.7; cube.y = player.y + Math.sin(player.dir) * 0.7; }
            button.pressed = Math.hypot(cube.x - button.x, cube.y - button.y) < 0.6;
            map[exitPos.y][exitPos.x] = button.pressed ? 0 : 2;

            if(player.tpCooldown > 0) player.tpCooldown--;
            for(let k in portals) {
                let other = k === 'blue' ? 'orange' : 'blue';
                if(portals[k] && portals[other] && player.tpCooldown === 0) {
                    if(Math.hypot(player.x - portals[k].x, player.y - portals[k].y) < 0.4) {
                        let p = portals[other];
                        player.x = p.x + Math.cos(p.angle + Math.PI) * 0.7;
                        player.y = p.y + Math.sin(p.angle + Math.PI) * 0.7;
                        player.dir = p.angle + (player.dir - portals[k].angle) + Math.PI;
                        player.tpCooldown = 40;
                    }
                }
            }
            let mx = 0, my = 0;
            if (keys['KeyW']) { mx += Math.cos(player.dir)*player.speed; my += Math.sin(player.dir)*player.speed; }
            if (keys['KeyS']) { mx -= Math.cos(player.dir)*player.speed; my -= Math.sin(player.dir)*player.speed; }
            if (keys['KeyA']) { mx += Math.sin(player.dir)*player.speed; my -= Math.cos(player.dir)*player.speed; }
            if (keys['KeyD']) { mx -= Math.sin(player.dir)*player.speed; my += Math.cos(player.dir)*player.speed; }
            if (map[Math.floor(player.y)][Math.floor(player.x+mx)] === 0) player.x += mx;
            if (map[Math.floor(player.y+my)][Math.floor(player.x)] === 0) player.y += my;
        }

        const horizon = H/2 + player.pitch;
        ctx.fillStyle = "#111"; ctx.fillRect(0,0,W,horizon);
        ctx.fillStyle = "#002233"; ctx.fillRect(0,horizon,W,H-horizon);

        const zBuf = new Array(W).fill(20);
        for(let i=0; i<W; i++) {
            let angle = (player.dir - Math.PI/6) + (i/W)*(Math.PI/3);
            let d=0, hit=0, dx=Math.cos(angle), dy=Math.sin(angle), tx, ty, side;
            while(d<15 && !hit) {
                d += 0.03;
                tx = Math.floor(player.x + dx*d); ty = Math.floor(player.y + dy*d);
                if(map[ty] && map[ty][tx] > 0) {
                    hit = map[ty][tx];
                    let xd = Math.abs((player.x+dx*d)-(tx+0.5)), yd = Math.abs((player.y+dy*d)-(ty+0.5));
                    side = xd > yd ? ((player.x+dx*d)<tx+0.5?'W':'E') : ((player.y+dy*d)<ty+0.5?'N':'S');
                }
            }
            let dist = d * Math.cos(angle - player.dir);
            zBuf[i] = dist;
            let h = H/dist;
            let top = horizon - h/2;

            let pCol = null;
            for(let k in portals) {
                let p = portals[k];
                if(p && p.tx === tx && p.ty === ty && p.side === side) {
                    let dh = Math.hypot((player.x+dx*d)-p.x, (player.y+dy*d)-p.y);
                    if((dh*dh/0.04) + (Math.pow((H/2-h/2+h/2 - (H/2))/h,2)/0.25) < 1) pCol = k === 'blue' ? '#0af' : '#f80';
                }
            }
            ctx.fillStyle = pCol ? pCol : (hit === 2 ? "#f00" : `rgb(${180-d*10},${180-d*10},${180-d*10})`);
            ctx.fillRect(i, top, 1, h);

            drawSpr(i, angle, button.x, button.y, button.pressed?"#4f4":"#00f", 0.6, 0.1, zBuf[i], horizon);
            drawSpr(i, angle, cube.x, cube.y, "#fff", 0.3, 0.4, zBuf[i], horizon);
        }
        requestAnimationFrame(frame);
    }

    function drawSpr(i, rayA, sx, sy, col, sw, sh, wallD, hor) {
        let dx = sx - player.x, dy = sy - player.y;
        let d = Math.hypot(dx, dy);
        let a = Math.atan2(dy, dx) - player.dir;
        while(a < -Math.PI) a += Math.PI*2; while(a > Math.PI) a -= Math.PI*2;
        if(d < wallD && Math.abs(a) < Math.PI/3) {
            let x = (a / (Math.PI/3)) * W + W/2;
            let h = H / (d * Math.cos(a)) * sh;
            let w = H / (d * Math.cos(a)) * sw;
            if(Math.abs(i - x) < w/2) {
                ctx.fillStyle = col;
                let floorY = hor + (H / (d * Math.cos(a))) / 2;
                ctx.fillRect(i, floorY - h, 1, h);
            }
        }
    }
    frame();
</script>
</body>
</html>
