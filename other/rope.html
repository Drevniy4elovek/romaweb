<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Advanced Horizontal Trash Compactor</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        .ui { position: absolute; top: 20px; left: 20px; color: #00ffcc; pointer-events: none; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>
    <div class="ui">
        [УДЕРЖИВАЙ ПРОБЕЛ] — СЖАТИЕ<br>
        [КЛИК МЫШЬЮ] — ДОБАВИТЬ МУСОР
    </div>
    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let trash = [];
let pressX = 0;
let isPressing = false;

const PRESS_WIDTH = 80;
const SPEED_IN = 6;
const SPEED_OUT = 3;
const WALL_X = 400; // Правая граница контейнера

class Piece {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        
        // Типы мусора
        const types = [
            { name: 'can', color: '#95a5a6', minMult: 0.4 },
            { name: 'bottle', color: '#3498db', minMult: 0.2 },
            { name: 'box', color: '#d35400', minMult: 0.15 },
            { name: 'scrap', color: '#7f8c8d', minMult: 0.6 }
        ];
        this.type = types[Math.floor(Math.random() * types.length)];
        
        this.w = 50 + Math.random() * 30;
        this.h = 50 + Math.random() * 30;
        this.minW = this.w * this.type.minMult; // Лимит сжатия
        this.angle = Math.random() * Math.PI * 2;
    }

    update(pressRightEdge) {
        // Гравитация
        if (this.y + this.h/2 < height - 20) {
            this.vy += 0.5;
        } else {
            this.vy = 0;
            this.y = height - 20 - this.h/2;
            this.vx *= 0.8; // Трение о пол
        }
        
        this.x += this.vx;
        this.y += this.vy;

        // Коллизия с прессом
        if (this.x - this.w/2 < pressRightEdge) {
            let overlap = pressRightEdge - (this.x - this.w/2);
            if (this.w > this.minW) {
                this.x += overlap;
                this.w -= overlap * 0.7; // Сжатие
                this.h += overlap * 0.3; // Рост в высоту
            } else {
                this.x = pressRightEdge + this.w/2; // Просто толкаем
            }
        }

        // Коллизия с правой стенкой
        if (this.x + this.w/2 > WALL_X) {
            let overlap = (this.x + this.w/2) - WALL_X;
            if (this.w > this.minW) {
                this.x -= overlap;
                this.w -= overlap * 0.7;
                this.h += overlap * 0.3;
            } else {
                this.x = WALL_X - this.w/2;
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        
        // Тело объекта
        ctx.fillStyle = this.type.color;
        ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
        
        // Детали (текстура)
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.lineWidth = 2;
        ctx.strokeRect(-this.w/2, -this.h/2, this.w, this.h);
        
        if (this.type.name === 'can') {
            for(let i = -this.h/2+5; i < this.h/2; i+=10) {
                ctx.beginPath(); ctx.moveTo(-this.w/2, i); ctx.lineTo(this.w/2, i); ctx.stroke();
            }
        }
        ctx.restore();
    }
}

function resolveCollisions() {
    for (let i = 0; i < trash.length; i++) {
        for (let j = i + 1; j < trash.length; j++) {
            let a = trash[i];
            let b = trash[j];
            
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let combinedW = (a.w + b.w) / 2;
            let combinedH = (a.h + b.h) / 2;

            if (Math.abs(dx) < combinedW && Math.abs(dy) < combinedH) {
                let overlapX = combinedW - Math.abs(dx);
                let overlapY = combinedH - Math.abs(dy);

                if (overlapX < overlapY) {
                    let dir = dx > 0 ? 1 : -1;
                    a.x -= (overlapX / 2) * dir;
                    b.x += (overlapX / 2) * dir;
                } else {
                    let dir = dy > 0 ? 1 : -1;
                    a.y -= (overlapY / 2) * dir;
                    b.y += (overlapY / 2) * dir;
                }
            }
        }
    }
}

function init() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    pressX = -PRESS_WIDTH;
}

window.onkeydown = (e) => { if(e.code === 'Space') isPressing = true; };
window.onkeyup = (e) => { if(e.code === 'Space') isPressing = false; };
window.onmousedown = (e) => {
    if (e.clientX > WALL_X) return;
    trash.push(new Piece(e.clientX, e.clientY));
};

function animate() {
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 0, width, height);

    // Логика пресса
    if (isPressing) {
        if (pressX + PRESS_WIDTH < WALL_X - 20) pressX += SPEED_IN;
    } else {
        if (pressX > -PRESS_WIDTH) pressX -= SPEED_OUT;
    }

    // Пол и стенка
    ctx.fillStyle = '#111';
    ctx.fillRect(0, height - 20, width, 20);
    ctx.fillStyle = '#333';
    ctx.fillRect(WALL_X, 0, 20, height);

    // Мусор
    trash.forEach(t => t.update(pressX + PRESS_WIDTH));
    for(let i=0; i<3; i++) resolveCollisions();
    trash.forEach(t => t.draw());

    // Пресс
    ctx.fillStyle = '#555';
    ctx.fillRect(0, height/2 - 20, pressX + PRESS_WIDTH, 40); // Шток
    ctx.fillStyle = '#888';
    ctx.fillRect(pressX, 0, PRESS_WIDTH, height - 20); // Плита
    
    // Желтые полоски
    ctx.fillStyle = '#f1c40f';
    for(let i=0; i<height-20; i+=40) {
        ctx.beginPath();
        ctx.moveTo(pressX + 60, i);
        ctx.lineTo(pressX + 80, i + 20);
        ctx.lineTo(pressX + 80, i + 40);
        ctx.lineTo(pressX + 60, i + 20);
        ctx.fill();
    }

    requestAnimationFrame(animate);
}

window.onresize = init;
init();
animate();
</script>
</body>
</html>
