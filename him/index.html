<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Симуляция дегидрирования: Бензол 2025</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; overflow: hidden; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px;
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 10; width: 300px;
        }
        select, button { padding: 10px; width: 100%; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 10px; font-size: 16px; cursor: pointer; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
        .formula-box { font-family: monospace; font-size: 1.5em; font-weight: bold; color: #2c3e50; }
        .error-msg { color: #d35400; font-size: 13px; font-weight: bold; height: 1.5em; margin-top: 5px; }
    </style>
</head>
<body>

<div id="ui-panel">
    <select id="alkaneSelect">
        <option value="1">Метан</option>
        <option value="2" selected>Этан</option>
        <option value="3">Пропан</option>
        <option value="4">Бутан</option>
        <option value="5">Пентан</option>
        <option value="6">Гексан</option>
        <option value="7">Гептан</option>
        <option value="8">Октан</option>
        <option value="benzene">Бензол</option>
    </select>
    <button id="resetBtn">Сбросить реакцию</button>
    <div class="info">
        <div id="nameDisplay" style="font-weight: 600; color: #1a1a1a;">Этан</div>
        <div id="formulaDisplay" class="formula-box">C₂H₆</div>
        <div id="errorDisplay" class="error-msg"></div>
    </div>
</div>

<div id="modal" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 12px; box-shadow: 0 0 50px rgba(0,0,0,0.5); z-index: 1000; min-width: 250px;">
    <h3 id="modalTitle" style="margin-top:0; font-size: 18px;">Изменить группу:</h3>
    
    <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-size: 14px;">Выберите радикал:</label>
        <select id="radicalSelect" style="width: 100%; padding: 8px; border-radius: 4px;">
            <option value="H">Водород (-H)</option>
            <option value="CH3">Метил (-CH₃)</option>
            <option value="OH">Гидроксил (-OH)</option>
            <option value="Cl">Хлор (-Cl)</option>
            <option value="Br">Бром (-Br)</option>
            <option value="NO2">Нитрогруппа (-NO₂)</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px;">
        <button id="applyRadicalBtn" style="background-color: #2ecc71; flex: 1;">Применить</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="background-color: #95a5a6; flex: 1;">Отмена</button>
    </div>
</div>


<canvas id="moleculeCanvas"></canvas>

<script>
     const canvas = document.getElementById('moleculeCanvas');
    const ctx = canvas.getContext('2d');
    const select = document.getElementById('alkaneSelect');
    const resetBtn = document.getElementById('resetBtn');
    const errorDisplay = document.getElementById('errorDisplay');
    const modal = document.getElementById('modal');
    const applyRadicalBtn = document.getElementById('applyRadicalBtn');
    const radicalSelect = document.getElementById('radicalSelect');

    let mode = 'linear'; 
    let n = 2;
    let bondStates = []; 
    let anims = []; 
    let radicals = {};      // Хранилище радикалов: { "ID": "Тип" }
    let currentTargetH = null; // ID выбранного атома для замены
    const spacing = 120;

    function getSub(num) {
        if (num === 0) return "VOID"; // Пометка для удаления
        if (num === 1) return ""; 
        return num.toString().split('').map(d => "₀₁₂₃₄₅₆₇₈₉"[d] || d).join('');
}

function updateUI() {
    let baseC = (mode === 'benzene') ? 6 : n;
    let baseH = (mode === 'benzene') ? 6 : (2 * n + 2);
    const roots = ["", "мет", "эт", "проп", "бут", "пент", "гекс", "гепт", "окт"];

    // 1. Считаем кратность связей
    let suffix = "ан";
    if (mode === 'linear') {
        bondStates.forEach(s => {
            if (s === 2) { baseH -= 2; suffix = "ен"; }
            if (s === 3) { baseH -= 4; suffix = "ин"; }
        });
    }

    // 2. Считаем радикалы
    let extra = { O: 0, Cl: 0, Br: 0, N: 0 };
    let radicalCounts = {}; 

    Object.values(radicals).forEach(val => {
        if (val === 'H') return;
        baseH -= 1;
        radicalCounts[val] = (radicalCounts[val] || 0) + 1;
        
        if (val === 'CH₃') { baseC += 1; baseH += 3; }
        else if (val === 'OH') { extra.O += 1; baseH += 1; }
        else if (val === 'Cl') { extra.Cl += 1; }
        else if (val === 'Br') { extra.Br += 1; }
        else if (val === 'NO₂') { extra.N += 1; extra.O += 2; }
    });

    // 3. ГЕНЕРАЦИЯ НАЗВАНИЯ
    let finalName = "";
    if (mode === 'benzene') {
        finalName = "бензол";
        if (radicalCounts['OH']) finalName = radicalCounts['OH'] > 1 ? "полифенол" : "фенол";
        else if (radicalCounts['CH₃']) finalName = radicalCounts['CH₃'] === 1 ? "толуол" : "ксилол";
        else if (radicalCounts['NO₂']) finalName = "нитробензол";
        else if (radicalCounts['Cl']) finalName = radicalCounts['Cl'] === 6 ? "гексахлорбензол" : "хлорбензол";
    } else {
        let mainRoot = roots[baseC] || "поли";
        if (radicalCounts['OH']) finalName = mainRoot + "ан" + (radicalCounts['OH'] > 1 ? "ди" : "") + "ол";
        else if (radicalCounts['Cl']) finalName = "хлор" + mainRoot + suffix;
        else if (radicalCounts['Br']) finalName = "бром" + mainRoot + suffix;
        else if (radicalCounts['NO₂']) finalName = "нитро" + mainRoot + suffix;
        else finalName = mainRoot + suffix;
    }
    
    // Если название не определилось (защита от пустоты)
    if (!finalName || finalName.includes("undefined")) finalName = "Сложное соединение";

    // 4. ГЕНЕРАЦИЯ ФОРМУЛЫ (Чистка от H0 и индексов 1)
    let components = [];
    
    // Углерод
    if (baseC > 0) components.push("C" + getSub(baseC));
    
    // Водород (если 0 - не пишем вообще)
    if (baseH > 0) components.push("H" + getSub(baseH));
    
    // Остальные элементы
    if (extra.N > 0) components.push("N" + getSub(extra.N));
    if (extra.O > 0) components.push("O" + getSub(extra.O));
    if (extra.Cl > 0) components.push("Cl" + getSub(extra.Cl));
    if (extra.Br > 0) components.push("Br" + getSub(extra.Br));

    // Склеиваем всё, убирая метки VOID
    let formulaStr = components.join('').replace(/VOID/g, "");

    document.getElementById('nameDisplay').innerText = finalName.charAt(0).toUpperCase() + finalName.slice(1);
    document.getElementById('formulaDisplay').innerText = formulaStr;
}


    function init() {
        const val = select.value;
        errorDisplay.innerText = "";
        radicals = {}; // Сброс радикалов при смене алкана
        if (val === 'benzene') {
            mode = 'benzene';
        } else {
            mode = 'linear';
            n = parseInt(val);
            bondStates = new Array(n - 1).fill(1);
            anims = new Array(n - 1).fill(null);
        }
        updateUI();
        draw();
    }

    function drawAtom(x, y, symbol, color, isH = false) {
        ctx.beginPath();
        ctx.arc(x, y, isH ? 22 : 26, 0, Math.PI * 2); // Увеличил радиус для радикалов
        ctx.fillStyle = color; ctx.fill();
        ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "#000"; ctx.font = `bold ${isH && symbol.length > 1 ? 11 : 14}px Arial`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(symbol, x, y);
    }

    function drawBondCC(x1, y1, x2, y2, level) {
        ctx.strokeStyle = "#555"; ctx.lineWidth = 4;
        if (level === 1) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
        else if (level === 2) {
            let dx = y2 - y1, dy = x1 - x2; let len = Math.sqrt(dx*dx + dy*dy); dx /= len; dy /= len;
            ctx.beginPath(); ctx.moveTo(x1 + dx*6, y1 + dy*6); ctx.lineTo(x2 + dx*6, y2 + dy*6); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x1 - dx*6, y1 - dy*6); ctx.lineTo(x2 - dx*6, y2 - dy*6); ctx.stroke();
        } else if (level === 3) {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            let dx = y2 - y1, dy = x1 - x2; let len = Math.sqrt(dx*dx + dy*dy); dx /= len; dy /= len;
            ctx.beginPath(); ctx.moveTo(x1 + dx*10, y1 + dy*10); ctx.lineTo(x2 + dx*10, y2 + dy*10); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x1 - dx*10, y1 - dy*10); ctx.lineTo(x2 - dx*10, y2 - dy*10); ctx.stroke();
        }
    }

    function drawLinear() {
        const startX = n === 1 ? canvas.width / 2 : (canvas.width - (n - 1) * spacing) / 2;
        const startY = canvas.height / 2;
        
        for (let i = 0; i < n - 1; i++) drawBondCC(startX + i * spacing, startY, startX + (i + 1) * spacing, startY, bondStates[i]);
        
        for (let i = 0; i < n; i++) {
            const cx = startX + i * spacing, cy = startY;

            // Боковые H
            if (n === 1 || i === 0) { 
                let id = "side_L"; let sym = radicals[id] || 'H';
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - spacing, cy); ctx.stroke(); 
                drawAtom(cx - spacing, cy, sym, sym === 'H' ? '#fff' : '#f1c40f', true); 
            }
            if (n === 1 || i === n - 1) { 
                let id = "side_R"; let sym = radicals[id] || 'H';
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + spacing, cy); ctx.stroke(); 
                drawAtom(cx + spacing, cy, sym, sym === 'H' ? '#fff' : '#f1c40f', true); 
            }

            let hU = true, hD = true, uO = 0, dO = 0, dU = true, dD = true;
            if (i < n - 1 && bondStates[i] >= 2) { if (anims[i] && anims[i].s === 1) { uO = -anims[i].p * 6; dU = false; } else hU = false; }
            if (i > 0 && bondStates[i-1] === 3) { if (anims[i-1] && anims[i-1].s === 2) { uO = -anims[i-1].p * 6; dU = false; } else hU = false; }
            if (i > 0 && bondStates[i-1] >= 2) { if (anims[i-1] && anims[i-1].s === 1) { dO = anims[i-1].p * 6; dD = false; } else hD = false; }
            if (i < n - 1 && bondStates[i] === 3) { if (anims[i] && anims[i].s === 2) { dO = anims[i].p * 6; dD = false; } else hD = false; }

            if (hU) { 
                let id = `H_C${i+1}_up`; let sym = radicals[id] || 'H';
                if (dU) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - spacing); ctx.stroke(); } 
                drawAtom(cx, cy - spacing + uO, sym, sym === 'H' ? '#fff' : '#f1c40f', true); 
            }
            if (hD) { 
                let id = `H_C${i+1}_down`; let sym = radicals[id] || 'H';
                if (dD) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + spacing); ctx.stroke(); } 
                drawAtom(cx, cy + spacing + dO, sym, sym === 'H' ? '#fff' : '#f1c40f', true); 
            }
            drawAtom(cx, cy, 'C', '#bdc3c7');
        }
    }

    function drawBenzene() {
        const cx = canvas.width / 2, cy = canvas.height / 2, r = 100, hR = 170;
        const pts = [];
        for (let i = 0; i < 6; i++) pts.push({ x: cx + r * Math.cos(i * Math.PI / 3), y: cy + r * Math.sin(i * Math.PI / 3) });
        for (let i = 0; i < 6; i++) {
            drawBondCC(pts[i].x, pts[i].y, pts[(i + 1) % 6].x, pts[(i + 1) % 6].y, (i % 2 === 0 ? 2 : 1));
            const hx = cx + hR * Math.cos(i * Math.PI / 3), hy = cy + hR * Math.sin(i * Math.PI / 3);
            let id = `Benz_H${i+1}`; let sym = radicals[id] || 'H';
            ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(hx, hy); ctx.stroke();
            drawAtom(hx, hy, sym, sym === 'H' ? '#fff' : '#f1c40f', true);
        }
        pts.forEach(p => drawAtom(p.x, p.y, 'C', '#bdc3c7'));
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (mode === 'benzene') drawBenzene(); else drawLinear();
        anims.forEach((a, i) => { if (a) { a.p += 2; if (a.p > 200) anims[i] = null; } });
        if (anims.some(a => a !== null)) requestAnimationFrame(draw);
    }

    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        let hPoints = [];
        const startY = canvas.height / 2;

        if (mode === 'linear') {
            const startX = (canvas.width - (n - 1) * spacing) / 2;
            for (let i = 0; i < n; i++) {
                const cx = startX + i * spacing;
                hPoints.push({x: cx, y: startY - spacing, id: `H_C${i+1}_up`});
                hPoints.push({x: cx, y: startY + spacing, id: `H_C${i+1}_down`});
                if (i === 0) hPoints.push({x: cx - spacing, y: startY, id: "side_L"});
                if (i === n - 1) hPoints.push({x: cx + spacing, y: startY, id: "side_R"});
            }
        } else {
            const cx = canvas.width / 2, cy = canvas.height / 2, hR = 170;
            for (let i = 0; i < 6; i++) hPoints.push({x: cx + hR * Math.cos(i * Math.PI / 3), y: cy + hR * Math.sin(i * Math.PI / 3), id: `Benz_H${i+1}`});
        }

        // 1. Клик по водороду (меню радикалов)
        let hitH = hPoints.find(p => Math.hypot(p.x - mx, p.y - my) < 30);
        if (hitH) {
            currentTargetH = hitH.id;
            modal.style.display = 'block';
            return;
        }

        // 2. Клик по связи (дегидрирование)
        if (mode === 'linear') {
            const startX = (canvas.width - (n - 1) * spacing) / 2;
            for (let i = 0; i < n - 1; i++) {
                if (Math.hypot(mx - (startX + i * spacing + spacing / 2), my - startY) < 30) {
                    if (n === 6 && bondStates[i] === 1 && !bondStates.some(s => s > 1)) {
                        if (confirm("Циклизовать гексан в бензол?")) { select.value = 'benzene'; init(); return; }
                    }
                    if (bondStates[i] < 3) { bondStates[i]++; anims[i] = { p: 0, s: bondStates[i] - 1 }; updateUI(); draw(); }
                }
            }
        }
    });

    applyRadicalBtn.onclick = () => {
        radicals[currentTargetH] = radicalSelect.value;
        modal.style.display = 'none';
        updateUI();
        draw();
    };

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; draw(); });
    select.addEventListener('change', init);
    resetBtn.addEventListener('click', init);
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    init();


</script>
</body>
</html>
