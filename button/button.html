<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Button</title>
	<link rel="stylesheet" href="button.css" />
</head>
<body>
	<div class="container">
		<div class="item">
			<img class="image" src="https://minecraft.wiki/images/Wooden_Pickaxe_JE3_BE3.png?fa797" />
			<span class="text">Деревянная кирка</span>
			<p>1$</p>
		</div>
		<div class="item">
			<img class="image" src="https://minecraft.wiki/images/Stone_Pickaxe_JE2_BE2.png?650b0" />
			<span>Каменная кирка</span>
			<p>10$</p>
		</div>
		<div class="item">
			<img class="image" src="https://minecraft.wiki/images/Iron_Pickaxe_JE3_BE2.png?8a6ea" />
			<span>Железная кирка</span>
			<p>100$</p>
		</div>
		<div class="item">
			<img class="image" src="https://minecraft.wiki/images/Golden_Pickaxe_JE4_BE3.png?f9470" />
			<span>Золотая кирка</span>
			<p>1000$</p>
		</div>
		<div class="item">
			<img class="image" src="https://minecraft.wiki/images/Diamond_Pickaxe_JE3_BE3.png?fa797" />
			<span>Алмазная кирка</span>
			<p>10000$</p>
		</div>
		<div class="item">
			<img class="image" src="https://minecraft.wiki/images/Netherite_Pickaxe_JE3.png?36cb3" />
			<span>Незеритовая кирка</span>
			<p>100000$</p>
		</div>
	</div>
</body>
</html>
