<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабиринт: Туман войны</title>
    <style>
        body { background: #000; color: #fff; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        canvas { display: block; }
        .ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>

    <div class="ui">
        <div style="font-size: 20px; color: #3498db; font-weight: bold;">ТУМАН ВОЙНЫ</div>
        <div style="font-size: 14px; opacity: 0.7;">Найдите выход в темноте...</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const gridSize = 101; 
    const tileSize = 60; 
    const playerRadius = 0.25; 
    
    let maze = [];
    let player = { x: 1.5, y: 1.5, speed: 0.12 }; 
    let keys = {};

    function generateMaze(size) {
        let m = Array(size).fill().map(() => Array(size).fill(1));
        function walk(x, y) {
            m[y][x] = 0;
            let dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
            for (let [dx, dy] of dirs) {
                let nx = x + dx, ny = y + dy;
                if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && m[ny][nx] === 1) {
                    m[y + dy / 2][x + dx / 2] = 0;
                    walk(nx, ny);
                }
            }
        }
        walk(1, 1);
        m[size - 2][size - 2] = 3;
        return m;
    }

    maze = generateMaze(gridSize);

    window.onkeydown = (e) => keys[e.code] = true;
    window.onkeyup = (e) => keys[e.code] = false;

    function canMoveTo(nx, ny) {
        const points = [
            {x: nx - playerRadius, y: ny - playerRadius},
            {x: nx + playerRadius, y: ny - playerRadius},
            {x: nx - playerRadius, y: ny + playerRadius},
            {x: nx + playerRadius, y: ny + playerRadius}
        ];
        for (let p of points) {
            if (maze[Math.floor(p.y)][Math.floor(p.x)] === 1) return false;
        }
        return true;
    }

    function update() {
        let moveX = 0, moveY = 0;
        if (keys['ArrowUp'])    moveY -= player.speed;
        if (keys['ArrowDown'])  moveY += player.speed;
        if (keys['ArrowLeft'])  moveX -= player.speed;
        if (keys['ArrowRight']) moveX += player.speed;

        if (canMoveTo(player.x + moveX, player.y)) player.x += moveX;
        if (canMoveTo(player.x, player.y + moveY)) player.y += moveY;

        if (maze[Math.floor(player.y)][Math.floor(player.x)] === 3) {
            alert("Победа! Вы вышли из тьмы!");
            player.x = 1.5; player.y = 1.5;
        }
    }

    function draw() {
        ctx.fillStyle = '#000'; // Фон за пределами лабиринта
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        const camX = -player.x * tileSize + canvas.width / 2;
        const camY = -player.y * tileSize + canvas.height / 2;
        ctx.translate(camX, camY);

        // Рисуем лабиринт
        const range = 15;
        const startX = Math.max(0, Math.floor(player.x - range));
        const endX = Math.min(gridSize, Math.ceil(player.x + range));
        const startY = Math.max(0, Math.floor(player.y - range));
        const endY = Math.min(gridSize, Math.ceil(player.y + range));

        for (let y = startY; y < endY; y++) {
            for (let x = startX; x < endX; x++) {
                if (maze[y][x] === 1) {
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(x * tileSize, y * tileSize, tileSize + 1, tileSize + 1);
                } else if (maze[y][x] === 3) {
                    ctx.fillStyle = '#2ecc71';
                    ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                }
            }
        }

        // Игрок
        ctx.fillStyle = '#3498db';
        ctx.beginPath();
        ctx.arc(player.x * tileSize, player.y * tileSize, tileSize * playerRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // --- ЭФФЕКТ ТУМАНА ---
        // Создаем градиент с центром в середине экрана (там всегда игрок)
        const gradient = ctx.createRadialGradient(
            canvas.width / 2, canvas.height / 2, 0,            // Центр (яркая точка)
            canvas.width / 2, canvas.height / 2, tileSize * 5  // Край (радиус видимости 5 клеток)
        );
        gradient.addColorStop(0, 'rgba(0,0,0,0)');   // В центре полностью прозрачно
        gradient.addColorStop(0.4, 'rgba(0,0,0,0)'); // Небольшая зона полной видимости
        gradient.addColorStop(1, 'rgba(0,0,0,1)');   // На краю — полная темнота

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        update();
        requestAnimationFrame(draw);
    }

    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    };

    draw();
</script>
</body>
</html>
